name: Neon DB Branch Preview

# Every PR that touches pipeline code gets an isolated copy-on-write branch of
# the production Neon database. The loader is exercised against that branch --
# schema changes and loader bugs surface in the PR, never in production data.
# The branch is deleted when the PR closes.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "scraper/**"
      - "scripts/**"
      - "tests/**"

env:
  NEON_PROJECT_ID: icy-salad-40937814

jobs:
  create_and_test:
    name: Test loader on a DB branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r scraper/requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Create Neon branch for this PR
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Run loader against the DB branch
        env:
          NEON_DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
        run: python scripts/load_to_neon.py

      - name: Verify branch load
        env:
          BRANCH_DB_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}
        run: |
          python - <<'EOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["BRANCH_DB_URL"])
          cur = conn.cursor()
          cur.execute("SELECT COUNT(*), COUNT(DISTINCT _scrape_date) FROM listings;")
          rows, days = cur.fetchone()
          print(f"Branch DB: {rows} listings across {days} day(s)")
          assert rows > 0, "Loader inserted nothing into the branch database"
          EOF

  delete_branch:
    name: Delete DB branch on PR close
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: icy-salad-40937814
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

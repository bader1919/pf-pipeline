name: Daily Property Scrape

on:
  schedule:
    # Optimal time per the June 2026 timing study: 16:00-20:00 UTC (evening
    # Bahrain time) sees the most listing/price activity, so the snapshot
    # captures the freshest market state.
    - cron: "0 20 * * *"  # Runs at 20:00 UTC every day
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  scrape:
    name: Scrape → Clean → Compare → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 120        # scrape takes ~10-15 min with 4 workers; generous buffer

    permissions:
      contents: write           # needed to push the data/ commit back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # ── Step 1: Discover categories dynamically and scrape all pages ─────────
      - name: Scrape PropertyFinder BH
        run: python scraper/pf_scraper.py

      # ── Step 2: Flatten raw JSON → clean CSVs in data/latest/ ───────────────
      - name: Clean data
        run: python scraper/cleaner.py

      # ── Step 3: Diff today vs yesterday, update change log ───────────────────
      - name: Run comparator
        run: python scraper/comparator.py

      # ── Step 4: Generate comprehensive report ─────────────────────────────────
      - name: Generate report
        run: python scraper/reporter.py

      # ── Step 5: Quality gate validation ─────────────────────────────────────────
      - name: Quality gate
        id: quality-gate
        run: python scraper/quality_gate.py --detailed
        continue-on-error: true

      # ── Step 6: Load snapshot + changes into Neon Postgres ───────────────────
      # Skipped when the NEON_DATABASE_URL secret is not configured.
      # continue-on-error: a DB outage must never block the data commit.
      - name: Load to Neon Postgres
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/load_to_neon.py
        continue-on-error: true

      # ── Step 7: Compress and archive raw JSON for future re-cleaning ──────────
      # Raw JSON is gzip-compressed (~85% smaller) then committed to data/raw_archive/.
      # This allows re-running the cleaner against any past snapshot if the schema changes.
      - name: Archive raw JSON (compressed)
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          ARCHIVE_DIR="data/raw_archive/${DATE}"
          mkdir -p "${ARCHIVE_DIR}"
          for f in data/raw/*.json; do
            [ -f "$f" ] || continue
            gzip -c "$f" > "${ARCHIVE_DIR}/$(basename $f).gz"
          done
          echo "Archived raw JSON to ${ARCHIVE_DIR}"
          ls -lh "${ARCHIVE_DIR}/"

      # ── Step 7: Commit updated data back to repo ─────────────────────────────
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/latest/
          git add data/previous/
          git add data/changes/
          git add data/latest_report.json
          git add data/latest/quality_report.json
          git add data/latest/quality_report.md
          git add data/raw_archive/

          # Only commit if there is something staged
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            # Get quality status for commit message
            QUALITY_STATUS="[PASS] Quality: PASS"
            if [ "${{ steps.quality-gate.outcome }}" != "success" ]; then
              QUALITY_STATUS="[WARNING] Quality: WARNING - see quality_report.md"
            fi

            DATE=$(date -u '+%Y-%m-%d')
            git commit -m "data: daily scrape ${DATE}

            ${QUALITY_STATUS}"
            git push
          fi

      # ── Step 7: Final quality report (always runs) ─────────────────────────────
      - name: Quality report summary
        if: always()
        run: python scraper/quality_gate.py --report-only

      # ── Step 8: Update handover log ──────────────────────────────────────────────
      - name: Update handover log
        if: always()
        run: python scraper/update_handover.py --event "Daily Scrape" --what "Daily pipeline execution completed" --status "${{ steps.quality-gate.outcome }}"

      # ── Summary ──────────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo "=== Snapshot counts ==="
          if [ -f data/latest/all_listings.csv ]; then
            # subtract 1 for header row
            TOTAL=$(( $(wc -l < data/latest/all_listings.csv) - 1 ))
            echo "Total listings: $TOTAL"
          else
            echo "all_listings.csv not found"
          fi

          echo ""
          echo "=== Change log size ==="
          if [ -f data/changes/all_changes.csv ]; then
            CHANGES=$(( $(wc -l < data/changes/all_changes.csv) - 1 ))
            echo "Cumulative change events: $CHANGES"
          else
            echo "all_changes.csv not found (first run?)"
          fi
